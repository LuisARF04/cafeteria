<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E3B3B">
<meta name="description" content="Carta y pedidos por mesa">
<title>Carta</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{
  --bone:#F3F1EA; --ink:#14201F; --petrol:#0E3B3B; --petrol2:#17514D;
  --mamey:#D8552A; --sage:#7E8F87; --line:#DFDBD1; --card:#FFFDF9;
  --ok:#2F6B4F; --bad:#B23A2A;
}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bone);color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:96px;overscroll-behavior-y:none;
}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
img{display:block;max-width:100%}
.hide{display:none!important}
:focus-visible{outline:2.5px solid var(--mamey);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── CABECERA ── */
header{
  position:sticky;top:0;z-index:40;background:var(--petrol);color:#F3F1EA;
  padding:calc(9px + env(safe-area-inset-top)) 14px 9px;display:flex;align-items:center;gap:11px;
}
.mark{width:34px;height:34px;flex:0 0 auto;display:grid;place-items:center;font-size:19px;
  background:#ffffff1a;border-radius:9px}
.hid{min-width:0;flex:1}
.hid b{display:block;font-size:14.5px;font-weight:650;letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mesa{display:flex;align-items:center;gap:5px;font-size:11.5px;color:#BFD4CE}
.pulse{width:7px;height:7px;border-radius:50%;background:#5FD39B;box-shadow:0 0 0 0 #5FD39B99;animation:pz 2.4s infinite}
@keyframes pz{70%{box-shadow:0 0 0 7px #5FD39B00}100%{box-shadow:0 0 0 0 #5FD39B00}}
.hbtn{width:36px;height:36px;flex:0 0 auto;border-radius:9px;background:#ffffff14;display:grid;place-items:center;font-size:15px}

/* ── FICHA DE LA TIENDA ── */
.shop{padding:16px 16px 4px}
.shop h1{font-size:25px;font-weight:720;letter-spacing:-.7px;line-height:1.1}
.meta{margin-top:7px;font-size:13px;color:var(--sage);line-height:1.7}
.estado{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:4px 11px 4px 9px;
  border-radius:4px;font-size:12px;font-weight:650}
.estado.a{background:#2F6B4F18;color:var(--ok)} .estado.c{background:#B23A2A18;color:var(--bad)}
.aviso{margin:10px 16px 0;padding:11px 13px;background:#B23A2A14;border-left:3px solid var(--bad);
  font-size:13.5px;color:var(--bad);border-radius:0 6px 6px 0}

/* ── BUSCADOR + CATEGORÍAS ── */
.tools{position:sticky;top:52px;z-index:30;background:var(--bone);padding-top:14px;
  box-shadow:0 10px 10px -10px #0000001a}
.find{margin:0 16px 11px;display:flex;align-items:center;gap:9px;background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:0 13px}
.find input{flex:1;border:0;background:none;padding:12px 0;font-size:15px}
.find input::placeholder{color:#A9B2AC}
.find span{color:var(--sage);font-size:15px}
.cats{display:flex;gap:7px;overflow-x:auto;padding:0 16px 13px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;padding:7px 14px;border-radius:7px;font-size:13.5px;font-weight:560;
  background:var(--card);border:1px solid var(--line);color:#4A5A55;white-space:nowrap}
.cat.on{background:var(--petrol);border-color:var(--petrol);color:#F3F1EA}

/* ── CARTA (filas estilo carta impresa) ── */
.sect{padding:22px 16px 0}
.sect h2{font-size:12.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--petrol)}
.sect .rule{height:2px;background:var(--petrol);margin-top:7px;opacity:.85}
.item{display:flex;gap:12px;align-items:flex-start;padding:15px 16px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.thumb{width:46px;height:46px;flex:0 0 auto;border-radius:9px;background:#E7E3D9;
  display:grid;place-items:center;font-size:23px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.body{flex:1;min-width:0}
.body h3{font-size:15.5px;font-weight:620;letter-spacing:-.2px;line-height:1.25}
.body p{font-size:12.5px;color:var(--sage);margin-top:3px;line-height:1.4}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex:0 0 auto}
.precio{font-size:19px;font-weight:720;color:var(--mamey);letter-spacing:-.6px;
  font-variant-numeric:tabular-nums;line-height:1}
.precio i{font-style:normal;font-size:10.5px;font-weight:650;color:var(--sage);letter-spacing:.3px}
.ref{font-size:10.5px;color:#A9B2AC;margin-top:-4px}
.plus{width:38px;height:38px;border-radius:10px;background:var(--petrol);color:#fff;
  font-size:21px;font-weight:400;display:grid;place-items:center;line-height:1;transition:transform .12s}
.plus:active{transform:scale(.88)}
.plus[disabled]{background:#D5D1C7;color:#fff}
.item.out .body h3,.item.out .precio{color:#A9B2AC}
.item.out .thumb{filter:grayscale(1);opacity:.5}
.agot{display:inline-block;margin-top:5px;padding:2px 8px;border-radius:4px;background:#B23A2A14;
  color:var(--bad);font-size:11px;font-weight:650}
.vacio{padding:48px 24px;text-align:center;color:var(--sage);font-size:14.5px}
.skel{height:76px;margin:0 16px;border-bottom:1px solid var(--line);
  background:linear-gradient(90deg,#0000 20%,#00000008 50%,#0000 80%);
  background-size:200% 100%;animation:sk 1.3s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ── BARRA DE PEDIDO ── */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:45;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bone) 62%,#F3F1EA00);transform:translateY(130%);
  transition:transform .26s cubic-bezier(.2,.9,.3,1)}
.bar.up{transform:none}
.bar button{width:100%;padding:15px 18px;border-radius:12px;background:var(--petrol);color:#F3F1EA;
  display:flex;align-items:center;gap:12px;box-shadow:0 6px 22px #0E3B3B4d;font-size:15px;font-weight:600}
.bar .n{position:relative;font-size:19px}
.bar .n b{position:absolute;top:-6px;right:-10px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;
  background:var(--mamey);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.bar .tt{margin-left:auto;font-weight:720;font-variant-numeric:tabular-nums}

/* ── PANTALLAS ── */
.scr{position:fixed;inset:0;z-index:60;background:var(--bone);overflow-y:auto;
  padding-bottom:160px;animation:sl .22s ease-out}
@keyframes sl{from{transform:translateX(16px);opacity:0}}
.sbar{position:sticky;top:0;z-index:5;background:var(--petrol);color:#F3F1EA;
  padding:calc(11px + env(safe-area-inset-top)) 14px 11px;display:flex;align-items:center;gap:11px}
.sbar h2{font-size:16px;font-weight:620;flex:1}

/* ── CARRITO ── */
.ci{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.ci .body b{display:block;font-size:14.5px;font-weight:600}
.ci .body span{font-size:12px;color:var(--sage);font-variant-numeric:tabular-nums}
.qty{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.qty button{width:34px;height:34px;font-size:17px;font-weight:600;color:var(--petrol)}
.qty b{min-width:22px;text-align:center;font-size:15px;font-variant-numeric:tabular-nums}
.x{width:30px;height:34px;color:#B9B3A8;font-size:15px}
.sums{margin:20px 16px 0;padding-top:14px;border-top:2px solid var(--petrol)}
.sum{display:flex;justify-content:space-between;font-size:13.5px;color:var(--sage);padding:3px 0;
  font-variant-numeric:tabular-nums}
.sum.big{font-size:26px;font-weight:740;color:var(--ink);letter-spacing:-.9px;padding-top:7px}
.acts{padding:22px 16px 0;display:flex;flex-direction:column;gap:9px}
.b{padding:15px;border-radius:11px;font-weight:620;text-align:center;font-size:15px;display:block;width:100%;
  text-decoration:none}
.b.pri{background:var(--petrol);color:#F3F1EA}
.b.go{background:var(--mamey);color:#fff}
.b.sec{background:var(--card);border:1px solid var(--line);color:var(--ink)}

/* ── DIVIDIR ── */
.help{margin:14px 16px;padding:12px 14px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;font-size:13px;color:var(--sage);line-height:1.5}
.lbl{margin:20px 16px 9px;font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--petrol)}
.pool{margin:0 16px;min-height:72px;border:2px dashed var(--line);border-radius:11px;padding:9px;
  display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;transition:background .15s,border-color .15s}
.pool.over,.acct.over{border-color:var(--mamey);background:#D8552A12}
.u{padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:9px;font-size:13px;
  display:flex;gap:7px;align-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
.u.sel{border-color:var(--mamey);box-shadow:0 0 0 2px #D8552A55}
.acct{margin:10px 16px;background:var(--card);border:2px solid var(--line);border-radius:11px;padding:12px}
.ah{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.ah input{flex:1;min-width:0;border:0;border-bottom:1px dashed var(--line);background:none;
  font-size:15px;font-weight:650;padding:3px 0}
.ah .at{font-size:12.5px;color:var(--sage);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.drop{min-height:52px;display:flex;flex-wrap:wrap;gap:7px;padding:6px;border-radius:9px;background:var(--bone)}
.drop em{font-style:normal;color:#A9B2AC;font-size:12px;padding:13px}
.ghost{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-50%) scale(1.07);
  box-shadow:0 8px 20px #0003}
.fix{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);
  padding:13px 16px calc(13px + env(safe-area-inset-bottom))}

/* ── ÉXITO ── */
.done{position:fixed;inset:0;z-index:95;background:var(--bone);display:grid;place-items:center;
  text-align:center;padding:26px}
.done .k{width:74px;height:74px;margin:0 auto 18px;border-radius:50%;background:var(--ok);color:#fff;
  display:grid;place-items:center;font-size:36px;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
.done.q .k{background:var(--petrol)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.done h2{font-size:23px;font-weight:720;letter-spacing:-.5px}
.done p{color:var(--sage);margin:10px 0 26px;font-size:14.5px;line-height:1.6}

/* ── CAPAS ── */
.ov{position:fixed;inset:0;background:#14201FA6;z-index:70;animation:fi .18s}
@keyframes fi{from{opacity:0}}
.draw{position:fixed;top:0;bottom:0;left:0;width:79%;max-width:310px;background:var(--card);z-index:71;
  padding:calc(22px + env(safe-area-inset-top)) 18px 22px;display:flex;flex-direction:column;
  animation:sr .24s cubic-bezier(.2,.9,.3,1);box-shadow:6px 0 28px #0003}
@keyframes sr{from{transform:translateX(-100%)}}
.draw .dh{padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:10px}
.draw .dh b{font-size:18px;font-weight:700;letter-spacing:-.3px}
.draw .dh div{font-size:12.5px;color:var(--sage);margin-top:3px}
.di{padding:13px 11px;border-radius:9px;display:flex;gap:12px;align-items:center;font-size:15px;
  text-align:left;width:100%;text-decoration:none;color:inherit}
.di:active{background:var(--bone)}
.di.last{margin-top:auto;font-size:13px;color:var(--sage);justify-content:center;border:1px solid var(--line)}
.sheetw{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;border-radius:16px 16px 0 0;
  padding:22px 18px calc(22px + env(safe-area-inset-bottom));animation:su .24s cubic-bezier(.2,.9,.3,1)}
@keyframes su{from{transform:translateY(100%)}}
.sheet h3{font-size:19px;font-weight:700;letter-spacing:-.3px}
.sheet p{font-size:13.5px;color:var(--sage);margin:7px 0 18px;line-height:1.5}
.sheet .b{margin-bottom:9px}
.fly{position:fixed;z-index:100;pointer-events:none;width:40px;height:40px;border-radius:10px;
  background:var(--petrol);color:#fff;display:grid;place-items:center;font-size:20px;
  transition:transform .5s cubic-bezier(.4,0,.6,1),opacity .5s}
.toast{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);background:var(--ink);color:#F3F1EA;
  padding:11px 18px;border-radius:9px;z-index:200;font-size:13.5px;max-width:88%;text-align:center;
  box-shadow:0 6px 20px #0004;animation:fi .2s}
.net{position:fixed;left:0;right:0;top:0;z-index:98;background:var(--ink);color:#F3F1EA;font-size:12px;
  text-align:center;padding:calc(6px + env(safe-area-inset-top)) 10px 6px}
</style>
</head>
<body>

<header>
  <div class="mark" id="mark">☕</div>
  <div class="hid">
    <b id="hName">Cargando…</b>
    <div class="mesa"><span class="pulse"></span><span id="hMesa">Mesa —</span></div>
  </div>
  <button class="hbtn" onclick="ayuda()" aria-label="Ayuda">?</button>
  <button class="hbtn" onclick="menuLat()" aria-label="Menú">☰</button>
</header>

<main>
  <div class="shop">
    <h1 id="sName">&nbsp;</h1>
    <div class="meta"><span id="sHor"></span><br><span id="sDir"></span></div>
    <span class="estado" id="sEst"></span>
  </div>
  <div class="aviso hide" id="sAviso"></div>

  <div class="tools">
    <div class="find"><span>⌕</span><input id="q" placeholder="Buscar café, batido…" oninput="pinta()" aria-label="Buscar"></div>
    <div class="cats" id="cats"></div>
  </div>

  <div id="carta"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
</main>

<div class="bar" id="bar">
  <button onclick="verPedido()">
    <span class="n">🛒<b id="cnt">0</b></span>
    <span>Ver mi pedido</span>
    <span class="tt" id="barTot">0 CUP</span>
  </button>
</div>

<!-- PEDIDO -->
<div class="scr hide" id="scrCart">
  <div class="sbar"><button class="hbtn" onclick="cerrar('scrCart')" aria-label="Volver">←</button><h2>Mi pedido</h2></div>
  <div id="lista"></div>
  <div class="sums">
    <div class="sum"><span>Artículos</span><span id="nArt">0</span></div>
    <div class="sum" id="refUsd"></div>
    <div class="sum big"><span>Total</span><span id="tot">0 CUP</span></div>
  </div>
  <div class="acts">
    <button class="b go" onclick="enviar()">Enviar pedido a la cocina</button>
    <button class="b sec" onclick="abrirDividir()">Dividir la cuenta</button>
    <button class="b sec" onclick="cerrar('scrCart')">Seguir pidiendo</button>
  </div>
</div>

<!-- DIVIDIR -->
<div class="scr hide" id="scrSplit">
  <div class="sbar"><button class="hbtn" onclick="cerrar('scrSplit')" aria-label="Volver">←</button>
    <h2>Dividir la cuenta</h2><button class="hbtn" onclick="nuevaCuenta()" aria-label="Agregar cuenta">＋</button></div>
  <div class="help">Arrastra cada artículo hasta la cuenta que lo paga. También puedes tocarlo y luego tocar la cuenta.</div>
  <div class="lbl">Sin asignar</div>
  <div class="pool" id="pool"></div>
  <div class="lbl">Cuentas</div>
  <div id="accs"></div>
  <div class="fix">
    <div class="sum big" style="padding:0 0 11px"><span>Total</span><span id="splitTot">0 CUP</span></div>
    <button class="b go" onclick="enviar()">Enviar pedido a la cocina</button>
  </div>
</div>

<div id="capas"></div>
<script src="config.js"></script>
<script>
/* ═══════════ MESA DESDE EL QR ═══════════ */
function leerMesa(){
  const p=location.pathname.match(/mesa[\/-](\w+)/i); if(p)return p[1];
  const u=new URLSearchParams(location.search).get('mesa'); if(u)return u;
  const h=location.hash.match(/mesa[=\/](\w+)/i); if(h)return h[1];
  return null;
}
const DOS_HORAS=2*60*60*1000;
let ses=cache.get('ses',null);
if(ses&&Date.now()-ses.t>DOS_HORAS)ses=null;
const nueva=leerMesa();
if(nueva)ses={mesa:nueva,t:Date.now()};
if(!ses)ses={mesa:'—',t:Date.now()};
cache.set('ses',ses);
const MESA=ses.mesa;
let UID=cache.get('uid',null); if(!UID){UID='c'+Math.random().toString(36).slice(2,10);cache.set('uid',UID)}

/* ═══════════ ESTADO ═══════════ */
let CFG=cache.get('cfg',{nombre:'Cafetería',emoji:'☕',dir:'',hora:'',tasa:0,moneda2:'USD'});
let CATS=cache.get('cats',[]);
let PROD=cache.get('prod',[]);
let filtro='Todo';
let cart=cache.get('cart',{mesa:MESA,items:[]}); if(cart.mesa!==MESA)cart={mesa:MESA,items:[]};
let cuentas=[],units=[],sel=null;

const P=id=>PROD.find(x=>x.id==id);
const cup=n=>Math.round(n).toLocaleString('es-CU')+' CUP';
const nItems=()=>cart.items.reduce((a,i)=>a+i.q,0);
const total=()=>cart.items.reduce((a,i)=>a+i.q*(P(i.id)?+P(i.id).precio:0),0);
const guardaCart=()=>cache.set('cart',cart);

/* ═══════════ CARGA (caché primero, red después) ═══════════ */
async function cargar(){
  if(PROD.length){pintaTienda();pinta()}
  try{
    const [cfg,cats,prod]=await Promise.all([
      api.get('config?id=eq.1&select=datos'),
      api.get('categorias?select=nombre&order=orden'),
      api.get('productos?select=id,nombre,descripcion,precio,precio2,categoria,emoji,disponible,orden,img_v&order=categoria,orden')
    ]);
    CFG=cfg[0]?cfg[0].datos:CFG; CATS=cats.map(c=>c.nombre); PROD=prod;
    cache.set('cfg',CFG);cache.set('cats',CATS);cache.set('prod',PROD);
    pintaTienda();pinta();
  }catch(e){
    if(!PROD.length){
      document.getElementById('carta').innerHTML=
        '<div class="vacio">No se pudo cargar la carta.<br>Revisa tu conexión y vuelve a intentarlo.<br><br>'+
        '<button class="b sec" style="max-width:220px;margin:0 auto" onclick="cargar()">Reintentar</button></div>';
    }else toast('Mostrando la carta guardada');
  }
}

/* ═══════════ TIENDA ═══════════ */
function abierto(){
  if(CFG.forzarCerrado)return false;
  if(!CFG.abre||!CFG.cierra)return true;
  const d=new Date(),m=d.getHours()*60+d.getMinutes(),t=s=>{const[a,b]=s.split(':').map(Number);return a*60+b};
  const A=t(CFG.abre),C=t(CFG.cierra);
  return C>A?(m>=A&&m<C):(m>=A||m<C);
}
function pintaTienda(){
  const ab=abierto();
  document.getElementById('hName').textContent=CFG.nombre;
  document.getElementById('mark').textContent=CFG.emoji||'☕';
  document.getElementById('hMesa').textContent='Estás en la Mesa '+MESA;
  document.getElementById('sName').textContent=CFG.nombre;
  document.getElementById('sHor').textContent='Hoy '+(CFG.hora||'');
  document.getElementById('sDir').textContent=CFG.dir||'';
  const e=document.getElementById('sEst');
  e.className='estado '+(ab?'a':'c');
  e.innerHTML='<span class="pulse" style="background:currentColor;box-shadow:none"></span>'+(ab?'Abierto ahora':'Cerrado ahora');
  const av=document.getElementById('sAviso');
  av.classList.toggle('hide',ab);av.textContent=CFG.cerrado||'';
  document.title=CFG.nombre+' · Mesa '+MESA;
}

/* ═══════════ CARTA ═══════════ */
function pinta(){
  const c=document.getElementById('cats');c.innerHTML='';
  ['Todo',...CATS].forEach(x=>{
    const b=document.createElement('button');
    b.className='cat'+(filtro===x?' on':'');b.textContent=x;
    b.onclick=()=>{filtro=x;pinta()};c.appendChild(b);
  });
  const q=document.getElementById('q').value.toLowerCase().trim();
  const vis=PROD.filter(p=>(filtro==='Todo'||p.categoria===filtro)&&
    (!q||(p.nombre+' '+(p.descripcion||'')).toLowerCase().includes(q)));
  const cont=document.getElementById('carta');cont.innerHTML='';
  if(!vis.length){cont.innerHTML='<div class="vacio">'+(q?'Nada con «'+q+'».':'Esta sección está vacía por ahora.')+'</div>';pintaBarra();return}
  const presentes=[...new Set(vis.map(p=>p.categoria))];
  const grupos=CATS.filter(c=>presentes.includes(c)).concat(presentes.filter(c=>!CATS.includes(c)));
  grupos.forEach(g=>{
    const s=document.createElement('section');s.className='sect';
    s.innerHTML='<h2>'+g+'</h2><div class="rule"></div>';
    cont.appendChild(s);
    const wrap=document.createElement('div');cont.appendChild(wrap);
    vis.filter(p=>p.categoria===g).forEach(p=>wrap.appendChild(fila(p)));
  });
  pintaBarra();
}
function fila(p){
  const hay=p.disponible;
  const d=document.createElement('article');d.className='item'+(hay?'':' out');
  const ref=CFG.tasa>0?'<div class="ref">≈ '+(p.precio/CFG.tasa).toFixed(2)+' '+CFG.moneda2+'</div>':'';
  d.innerHTML=
    '<div class="thumb" data-img="'+(p.img_v>0?p.id:'')+'">'+(p.emoji||'🍽️')+'</div>'+
    '<div class="body"><h3>'+esc(p.nombre)+'</h3>'+
      (p.descripcion?'<p>'+esc(p.descripcion)+'</p>':'')+
      (hay?'':'<span class="agot">Agotado</span>')+'</div>'+
    '<div class="side"><div class="precio">'+Math.round(p.precio).toLocaleString('es-CU')+' <i>CUP</i></div>'+ref+
      '<button class="plus" '+(hay?'':'disabled')+' aria-label="Agregar '+esc(p.nombre)+'">+</button></div>';
  if(hay)d.querySelector('.plus').onclick=ev=>agregar(p,ev);
  const th=d.querySelector('.thumb'); if(p.img_v>0)imagen(th,p);
  return d;
}
const esc=s=>String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

/* imágenes: se descargan una sola vez y quedan guardadas */
const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){obs.unobserve(e.target);e.target._load&&e.target._load()}}),{rootMargin:'200px'});
function imagen(el,p){
  const k='img_'+p.id+'_'+p.img_v, g=cache.get(k,null);
  if(g){el.innerHTML='<img src="'+g+'" alt="">';return}
  el._load=async()=>{
    try{
      const r=await api.get('producto_img?producto_id=eq.'+p.id+'&select=data');
      if(r[0]){cache.set(k,r[0].data);el.innerHTML='<img src="'+r[0].data+'" alt="">'}
    }catch(e){}
  };
  obs.observe(el);
}

/* ═══════════ AGREGAR ═══════════ */
function agregar(p,ev){
  const it=cart.items.find(i=>i.id===p.id);
  it?it.q++:cart.items.push({id:p.id,q:1});
  guardaCart();vuela(ev.currentTarget,p.emoji||'🍽️');pintaBarra();
  if(navigator.vibrate)navigator.vibrate(11);
}
function vuela(from,em){
  const r=from.getBoundingClientRect(),f=document.createElement('div');
  f.className='fly';f.textContent=em;f.style.left=(r.left+r.width/2-20)+'px';f.style.top=(r.top)+'px';
  document.body.appendChild(f);
  const t=document.querySelector('#bar .n').getBoundingClientRect();
  requestAnimationFrame(()=>{
    f.style.transform='translate('+(t.left-r.left-r.width/2+20)+'px,'+(t.top-r.top+4)+'px) scale(.3)';
    f.style.opacity='0';
  });
  setTimeout(()=>f.remove(),560);
}
function pintaBarra(){
  const n=nItems();
  document.getElementById('bar').classList.toggle('up',n>0);
  document.getElementById('cnt').textContent=n;
  document.getElementById('barTot').textContent=cup(total());
}

/* ═══════════ PEDIDO ═══════════ */
const abrir=id=>document.getElementById(id).classList.remove('hide');
const cerrar=id=>document.getElementById(id).classList.add('hide');
function verPedido(){abrir('scrCart');pintaCart()}
function pintaCart(){
  const L=document.getElementById('lista');L.innerHTML='';
  if(!cart.items.length)L.innerHTML='<div class="vacio">Todavía no has agregado nada.</div>';
  cart.items.forEach(i=>{
    const p=P(i.id);if(!p)return;
    const d=document.createElement('div');d.className='ci';
    d.innerHTML='<div class="thumb">'+(p.emoji||'🍽️')+'</div>'+
      '<div class="body"><b>'+esc(p.nombre)+'</b><span>'+cup(p.precio)+' c/u · '+cup(p.precio*i.q)+'</span></div>'+
      '<div class="qty"><button aria-label="Quitar uno">−</button><b>'+i.q+'</b><button aria-label="Agregar uno">+</button></div>'+
      '<button class="x" aria-label="Eliminar">✕</button>';
    const[m,p2]=d.querySelectorAll('.qty button');
    m.onclick=()=>{i.q--;if(i.q<1)cart.items=cart.items.filter(x=>x!==i);guardaCart();pintaCart();pintaBarra()};
    p2.onclick=()=>{i.q++;guardaCart();pintaCart();pintaBarra()};
    d.querySelector('.x').onclick=()=>{cart.items=cart.items.filter(x=>x!==i);guardaCart();pintaCart();pintaBarra()};
    L.appendChild(d);
  });
  document.getElementById('nArt').textContent=nItems();
  document.getElementById('tot').textContent=cup(total());
  document.getElementById('refUsd').innerHTML=CFG.tasa>0
    ?'<span>Referencia</span><span>≈ '+(total()/CFG.tasa).toFixed(2)+' '+CFG.moneda2+'</span>':'';
  pintaBarra();
}

/* ═══════════ DIVIDIR ═══════════ */
function armaUnidades(){
  const viejo=units.slice();units=[];let k=0;
  cart.items.forEach(i=>{for(let j=0;j<i.q;j++){
    const prev=viejo.find(u=>u.pid===i.id&&!u._t); if(prev)prev._t=1;
    units.push({uid:'u'+(k++),pid:i.id,acc:prev?prev.acc:null});
  }});
  const ids=cuentas.map(c=>c.id);units.forEach(u=>{if(u.acc&&!ids.includes(u.acc))u.acc=null});
}
function abrirDividir(){
  if(!cart.items.length){toast('Agrega algo primero');return}
  if(!cuentas.length)cuentas=[{id:'c1',nombre:'Cuenta 1'},{id:'c2',nombre:'Cuenta 2'}];
  armaUnidades();abrir('scrSplit');pintaSplit();
}
function nuevaCuenta(){cuentas.push({id:'c'+Date.now(),nombre:'Cuenta '+(cuentas.length+1)});pintaSplit()}
function quitarCuenta(id){units.forEach(u=>{if(u.acc===id)u.acc=null});cuentas=cuentas.filter(c=>c.id!==id);pintaSplit()}
const totalCuenta=id=>units.filter(u=>u.acc===id).reduce((a,u)=>a+(P(u.pid)?+P(u.pid).precio:0),0);
function uEl(u){
  const p=P(u.pid)||{nombre:'?',emoji:'❓'};
  const d=document.createElement('div');
  d.className='u'+(sel===u.uid?' sel':'');d.dataset.uid=u.uid;
  d.innerHTML='<span>'+(p.emoji||'🍽️')+'</span><span>'+esc(p.nombre)+'</span>';
  d.onclick=()=>{sel=sel===u.uid?null:u.uid;pintaSplit()};
  d.addEventListener('pointerdown',e=>arrastrar(e,u,d));
  return d;
}
function pintaSplit(){
  armaUnidades();
  const pool=document.getElementById('pool');pool.innerHTML='';
  const libres=units.filter(u=>!u.acc);
  if(!libres.length)pool.innerHTML='<em style="font-style:normal;color:#A9B2AC;font-size:12.5px;padding:16px;margin:auto">Todo repartido</em>';
  libres.forEach(u=>pool.appendChild(uEl(u)));
  pool.onclick=e=>{if(sel&&!e.target.closest('.u'))asigna(sel,null)};
  const box=document.getElementById('accs');box.innerHTML='';
  cuentas.forEach(c=>{
    const mios=units.filter(u=>u.acc===c.id);
    const d=document.createElement('div');d.className='acct';d.dataset.acc=c.id;
    d.innerHTML='<div class="ah"><input value="'+esc(c.nombre)+'" placeholder="Nombre" aria-label="Nombre de la cuenta">'+
      '<span class="at">'+mios.length+' · '+cup(totalCuenta(c.id))+'</span>'+
      '<button class="x" aria-label="Quitar cuenta">✕</button></div><div class="drop"></div>';
    d.querySelector('input').oninput=e=>{c.nombre=e.target.value};
    d.querySelector('.x').onclick=e=>{e.stopPropagation();quitarCuenta(c.id)};
    const dr=d.querySelector('.drop');
    if(!mios.length)dr.innerHTML='<em>Suelta aquí lo que paga esta cuenta</em>';
    mios.forEach(u=>dr.appendChild(uEl(u)));
    d.onclick=e=>{if(sel&&!e.target.closest('.u')&&!e.target.closest('input'))asigna(sel,c.id)};
    box.appendChild(d);
  });
  document.getElementById('splitTot').textContent=cup(total());
}
function asigna(uid,acc){const u=units.find(x=>x.uid===uid);if(u)u.acc=acc;sel=null;pintaSplit()}

let drag=null;
function arrastrar(e,u,el){
  if(e.pointerType==='mouse'&&e.button!==0)return;
  drag={u,el,movido:false};el.setPointerCapture(e.pointerId);
  el.addEventListener('pointermove',mover);el.addEventListener('pointerup',soltar);
  el.addEventListener('pointercancel',soltar);
}
function mover(e){
  if(!drag)return;
  if(!drag.movido){
    drag.movido=true;
    const g=drag.el.cloneNode(true);g.className='u ghost';document.body.appendChild(g);
    drag.g=g;drag.el.style.opacity='.3';
  }
  drag.g.style.left=e.clientX+'px';drag.g.style.top=e.clientY+'px';
  drag.g.style.display='none';
  const t=document.elementFromPoint(e.clientX,e.clientY);
  drag.g.style.display='';
  document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));
  drag.zona=t&&(t.closest('.acct')||t.closest('.pool'));
  if(drag.zona)drag.zona.classList.add('over');
  e.preventDefault();
}
function soltar(){
  if(!drag)return;
  const{u,el,g,movido,zona}=drag;
  el.removeEventListener('pointermove',mover);el.removeEventListener('pointerup',soltar);
  el.removeEventListener('pointercancel',soltar);
  if(g)g.remove();el.style.opacity='';
  document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));
  if(movido&&zona){
    u.acc=zona.classList.contains('pool')?null:zona.dataset.acc;sel=null;pintaSplit();
    if(navigator.vibrate)navigator.vibrate(10);
  }
  drag=null;
}

/* ═══════════ ENVIAR ═══════════ */
function resumen(us){
  const m={};us.forEach(u=>{const p=P(u.pid);m[p.nombre]=m[p.nombre]||{n:p.nombre,q:0,p:+p.precio};m[p.nombre].q++});
  return Object.values(m);
}
async function enviar(){
  if(!cart.items.length){toast('Tu pedido está vacío');return}
  const dividido=cuentas.length>0&&units.some(u=>u.acc);
  let ctas;
  if(dividido){
    ctas=cuentas.map(c=>({nombre:c.nombre||'Cuenta',items:resumen(units.filter(u=>u.acc===c.id)),total:totalCuenta(c.id)}))
                .filter(c=>c.items.length);
    const libres=units.filter(u=>!u.acc);
    if(libres.length)ctas.push({nombre:'Sin asignar',items:resumen(libres),total:libres.reduce((a,u)=>a+ +P(u.pid).precio,0)});
  }else{
    ctas=[{nombre:'Cuenta única',items:cart.items.map(i=>({n:P(i.id).nombre,q:i.q,p:+P(i.id).precio})),total:total()}];
  }
  const ped={mesa:MESA,estado:'nuevo',dividido,cliente_uid:UID,
    items:cart.items.map(i=>({n:P(i.id).nombre,q:i.q,p:+P(i.id).precio})),cuentas:ctas,total:total()};
  const copia={total:ped.total,mesa:MESA};
  try{
    await api.add('pedidos',[ped]);
    limpiar();exito(copia,false);
  }catch(e){
    const cola=cache.get('cola',[]);cola.push(ped);cache.set('cola',cola);
    limpiar();exito(copia,true);
  }
}
function limpiar(){cart={mesa:MESA,items:[]};guardaCart();cuentas=[];units=[];sel=null;
  cerrar('scrSplit');cerrar('scrCart');pintaBarra()}
function exito(p,enCola){
  const d=document.createElement('div');d.className='done'+(enCola?' q':'');
  d.innerHTML='<div><div class="k">'+(enCola?'↻':'✓')+'</div>'+
   '<h2>'+(enCola?'Pedido en espera':'Pedido enviado')+'</h2>'+
   '<p>Mesa '+p.mesa+' · '+cup(p.total)+'<br>'+
   (enCola?'No hay conexión ahora mismo. Se envía solo en cuanto vuelva — puedes cerrar la página.'
          :'Ya lo está viendo la cocina.')+'</p>'+
   '<button class="b pri" style="max-width:280px;margin:0 auto">Hacer otro pedido</button></div>';
  d.querySelector('button').onclick=()=>d.remove();
  document.body.appendChild(d);
}
async function vaciarCola(){
  const cola=cache.get('cola',[]);if(!cola.length||!navigator.onLine)return;
  try{await api.add('pedidos',cola);cache.set('cola',[]);toast('Pedido pendiente enviado a la cocina')}catch(e){}
}
addEventListener('online',()=>{red();vaciarCola()});
addEventListener('offline',red);
setInterval(vaciarCola,20000);
function red(){
  let b=document.getElementById('netb');
  if(navigator.onLine){if(b)b.remove();return}
  if(!b){b=document.createElement('div');b.id='netb';b.className='net';
    b.textContent='Sin conexión · tu pedido se guarda y se envía solo';document.body.appendChild(b)}
}

/* ═══════════ CAPAS ═══════════ */
function capa(html){
  const w=document.createElement('div');w.innerHTML=html;
  document.getElementById('capas').appendChild(w);
  w.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>w.remove());
  return w;
}
function menuLat(){
  const w=capa('<div class="ov" data-x></div><div class="draw">'+
   '<div class="dh"><b>'+esc(CFG.nombre)+'</b><div>Mesa '+MESA+'</div></div>'+
   '<button class="di" data-a="carta">📋 Ver la carta</button>'+
   '<button class="di" data-a="cart">🛒 Mi pedido · '+nItems()+'</button>'+
   '<button class="di" data-a="help">💬 Ayuda y soporte</button>'+
   '<button class="di" data-a="info">📍 Horario y dirección</button>'+
   '<a class="di last" href="admin.html">Soy trabajador</a></div>');
  w.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.a;w.remove();
    if(a==='cart')verPedido(); if(a==='help')ayuda(); if(a==='info')info();
    if(a==='carta'){cerrar('scrCart');cerrar('scrSplit')}
  });
}
function ayuda(){
  const m=encodeURIComponent('Hola, soy de la Mesa '+MESA+', tengo una duda');
  capa('<div class="ov" data-x></div><div class="sheetw"><div class="sheet">'+
   '<h3>¿Necesitas ayuda?</h3><p>El pedido se hace desde la carta. WhatsApp y el teléfono son solo para dudas.</p>'+
   '<a class="b pri" href="https://wa.me/'+CFG.wa+'?text='+m+'" target="_blank" rel="noopener">Escribir por WhatsApp</a>'+
   '<a class="b sec" href="tel:+'+CFG.tel+'">Llamar a la cafetería</a>'+
   '<button class="b sec" data-x>Cerrar</button></div></div>');
}
function info(){
  capa('<div class="ov" data-x></div><div class="sheetw"><div class="sheet">'+
   '<h3>'+esc(CFG.nombre)+'</h3><p>'+(abierto()?'Abierto ahora':'Cerrado ahora')+'</p>'+
   '<div style="font-size:15px;line-height:2.1">🕐 '+esc(CFG.hora)+'<br>📍 '+esc(CFG.dir)+'<br>📞 +'+esc(CFG.tel)+'</div>'+
   '<div style="height:18px"></div><button class="b sec" data-x>Cerrar</button></div></div>');
}
function toast(t){
  const d=document.createElement('div');d.className='toast';d.textContent=t;
  document.body.appendChild(d);setTimeout(()=>d.remove(),2800);
}

/* arranque */
pintaTienda();pinta();cargar();red();vaciarCola();
setInterval(()=>{if(navigator.onLine&&document.visibilityState==='visible')cargar()},120000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')cargar()});
</script>
