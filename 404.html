<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abriendo la carta…</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F3F1EA;color:#14201F;
 font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px}
h1{font-size:19px;font-weight:650;letter-spacing:-.3px;margin:0 0 8px}
p{color:#7E8F87;font-size:14px;margin:0 0 20px}
a{display:inline-block;padding:13px 22px;border-radius:10px;background:#0E3B3B;color:#F3F1EA;
 text-decoration:none;font-weight:620}
</style>
</head>
<body>
<div>
  <h1 id="t">Abriendo la carta…</h1>
  <p id="s">Un momento.</p>
  <a id="go" href="./">Ir a la carta</a>
</div>
<script>
/* GitHub Pages manda aquí cualquier ruta desconocida.
   Convierte  /repo/mesa/4  →  /repo/?mesa=4  */
(function(){
  var p = location.pathname;
  var m = p.match(/^(.*?)\/mesa[\/-]([\w-]+)\/?$/i);
  if (m) {
    var base = m[1] + '/';
    var destino = base + '?mesa=' + encodeURIComponent(m[2]);
    document.getElementById('go').href = destino;
    location.replace(destino);
    return;
  }
  var base2 = p.split('/').slice(0, 2).join('/') + '/';
  document.getElementById('go').href = base2;
  document.getElementById('t').textContent = 'Esta página no existe';
  document.getElementById('s').textContent = 'Vuelve a la carta para hacer tu pedido.';
})();
</script>
</body>
</html>
